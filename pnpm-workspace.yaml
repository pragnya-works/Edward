packages:
  - "apps/*"
  - "packages/*"

overrides:
  express-rate-limit: "^8.2.2"
  csstype: "^3.2.3"
  js-yaml: "^4.1.1"
  tmp: "^0.2.4"
  rollup: "^4.59.0"
  serialize-javascript: "^7.0.3"
  esbuild: "^0.25.0"
  minimatch: "^10.2.3"
  basic-ftp: ">=5.2.0"
  fast-xml-parser: ">=5.3.8"
  flatted: "^3.4.0"
  "ajv@^6.0.0": "^6.12.6"
  "ajv@^8.0.0": ">=8.18.0"
  qs: "^6.14.2"
  dompurify: "link:./vendor/dompurify"
  undici: ">=7.24.0 <8"

allowBuilds:
  # The package's preinstall script is a no-op.
  "@google/genai": false
  # Downloads the sentry-cli binary used for source map uploads.
  "@sentry/cli": true
  # Postinstall only prints the core-js funding banner.
  core-js-pure: false
  # Optional ssh2 native accelerator; ssh2 has a pure-JS fallback.
  cpu-features: false
  # Installs the platform-specific esbuild binary.
  esbuild: true
  # Optional msgpackr native accelerator with a JS fallback.
  msgpackr-extract: false
  # Postinstall only warns about dependency version ranges.
  protobufjs: false
  # Runs sharp's platform binary check; required by apps/api.
  sharp: true
  # Builds an optional crypto binding only; ssh2 works without it.
  ssh2: false
